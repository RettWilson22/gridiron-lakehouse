version: 2

sources:
  - name: gold
    description: >
      Serving tables produced on Databricks. On Snowflake they are read either from the
      synced native tables (gold_source=synced, the default) or through the Iceberg views
      (gold_source=iceberg); both expose identical upper-case columns. DuckDB targets read
      the same tables from Parquet files via `external_location`.
    schema: "{{ 'ICEBERG' if var('gold_source') == 'iceberg' else 'SYNCED' }}"
    meta:
      external_location: "read_parquet('{{ var('gold_dir') }}/{name}.parquet')"
    tables:
      - name: player_week
        description: One row per QB/RB/WR/TE per regular-season game played.
      - name: team_week
        description: One row per team and regular-season game, played or upcoming.
      - name: defense_vs_position
        description: Fantasy points each defense allowed per game and position.
      - name: projections
        description: >
          Every published projection: walk-forward backtest weeks and live weeks, with
          ranks, tiers and start/sit labels in PPR, half PPR and standard scoring.
      - name: risers
        description: Usage over each player's last three games against earlier games.
      - name: backtest_metrics
        description: Walk-forward accuracy per season and position for the model and baselines.
