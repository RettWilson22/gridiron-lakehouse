version: 2

models:
  - name: stg_player_week
    description: Actual fantasy points and usage per player-game.
    columns:
      - name: player_week_key
        data_tests: [unique, not_null]
      - name: position
        data_tests:
          - accepted_values:
              arguments:
                values: ["QB", "RB", "WR", "TE"]
      - name: fantasy_points_ppr
        data_tests: [not_null]

  - name: stg_team_week
    columns:
      - name: team_week_key
        data_tests: [unique, not_null]
      - name: game_id
        data_tests: [not_null]

  - name: stg_defense_vs_position
    columns:
      - name: defense_week_key
        data_tests: [unique, not_null]
      - name: position
        data_tests:
          - accepted_values:
              arguments:
                values: ["QB", "RB", "WR", "TE"]

  - name: stg_projections
    description: One row per projected player-week (backtest and live).
    columns:
      - name: projection_key
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["backtest", "live"]
      - name: position
        data_tests:
          - accepted_values:
              arguments:
                values: ["QB", "RB", "WR", "TE"]
      - name: proj_ppr
        data_tests: [not_null]
      - name: start_sit_ppr
        data_tests:
          - accepted_values:
              arguments:
                values: ["Start", "Flex", "Sit"]

  - name: stg_risers
    columns:
      - name: riser_key
        data_tests: [unique, not_null]

  - name: stg_backtest_metrics
    columns:
      - name: metric_key
        data_tests: [unique, not_null]
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: ["model", "last3", "season_avg", "ecr"]
