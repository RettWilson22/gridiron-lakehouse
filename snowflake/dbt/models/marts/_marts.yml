version: 2

models:
  - name: mart_fourth_down_leaderboard
    description: >
      Team-season fourth-down aggressiveness relative to the model, regular season and
      neutral situations only (win probability 10-90%, at least five minutes left).
    columns:
      - name: team_season_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_team_season_summary')
                field: team_season_key
      - name: go_rate_when_recommended
        description: Share of model "go" situations where the team actually went for it.
        data_tests: [not_null]
      - name: decision_quality_rank
        description: 1 = fewest expected points lost per fourth down that season.
        data_tests: [not_null]

  - name: mart_team_trends
    description: Season-over-season change in each team's fourth-down behaviour.
    columns:
      - name: team_season_key
        data_tests: [unique, not_null]
      - name: seasons_in_sample
        data_tests: [not_null]

  - name: mart_fourth_down_calls
    description: Every scored fourth down with the actual call classified against the model.
    columns:
      - name: play_key
        data_tests: [unique, not_null]
      - name: call_quality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["agreed", "too_conservative", "too_aggressive", "different_kick"]
