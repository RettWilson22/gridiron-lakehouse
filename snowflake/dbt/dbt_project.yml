name: gridiron
version: "1.0.0"
config-version: 2
profile: gridiron

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Where the gold tables come from on Snowflake:
  #   iceberg - views over Iceberg tables read from Databricks Unity Catalog (primary)
  #   synced  - native tables loaded by scripts/sync_to_snowflake.py (fallback)
  gold_source: iceberg
  # DuckDB targets only: directory of gold parquet files (relative to this project).
  gold_dir: ../../tests/fixtures/gold

models:
  gridiron:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

data_tests:
  gridiron:
    +severity: error
