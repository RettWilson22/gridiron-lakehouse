name: gridiron
version: "2.0.0"
config-version: 2
profile: gridiron

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Where the serving tables come from on Snowflake:
  #   synced  - native tables loaded by scripts/sync_to_snowflake.py (the working path on
  #             Databricks Free Edition; see docs/deploy.md)
  #   iceberg - views over Iceberg tables read through Unity Catalog (needs external storage)
  gold_source: synced
  # DuckDB targets only: directory of serving-table Parquet files (relative to this project).
  gold_dir: ../../tests/fixtures/gold
  # Positional top-N that defines the backtest evaluation pool. Mirrors gridiron.tiers.POOL;
  # tests/test_snowflake_objects.py checks they match.
  pool_size: {"QB": 24, "RB": 48, "WR": 72, "TE": 24}

models:
  gridiron:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

data_tests:
  gridiron:
    +severity: error
