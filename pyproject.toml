[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gridiron"
version = "0.2.0"
description = "Fantasy football projections and weekly cheat sheet: Databricks for ingestion, transformation and ML; Snowflake for serving."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rett Wilson" }]
requires-python = ">=3.11"
# Core dependencies are kept small and are all preinstalled on Databricks serverless.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0"]
ml = ["mlflow-skinny>=3.1"]
sync = ["databricks-sql-connector>=3.4", "databricks-sdk>=0.40", "snowflake-connector-python[pandas]>=3.12"]
app = ["streamlit>=1.38", "duckdb>=1.1", "altair>=5"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridiron"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["snowflake/dbt/target", "snowflake/dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PL", "C4"]
ignore = [
    "PLR0913", # data functions legitimately take several keyword arguments
    "PLR2004", # football constants (the red zone, 12-team leagues) read better inline
    "N812",    # `functions as F` is the PySpark convention
    "SIM108",  # an if/else block is often clearer than a long ternary
]

[tool.ruff.lint.isort]
# The repo has top-level `databricks/` and `snowflake/` folders (bundle and SQL), which
# would otherwise make the vendor SDK namespaces look first-party.
known-third-party = ["databricks", "snowflake"]
known-first-party = ["gridiron"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"databricks/pipelines/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
files = [
    "src",
    "scripts",
    "tests",
    "databricks/jobs",
    "databricks/pipelines",
    "snowflake/streamlit",
    "streamlit_public",
]
strict = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src:snowflake/streamlit"

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = [
    "sklearn.*",
    "mlflow.*",
    "pyspark.*",
    "databricks.*",
    "snowflake.*",
    "streamlit.*",
    "altair.*",
    "duckdb.*",
    "pyarrow.*",
    "joblib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Expectation decorators (expect_all, expect_all_or_drop) exist only in the Databricks
# runtime's pyspark.pipelines, not in the open-source package mypy sees locally.
module = ["databricks.pipelines.*"]
disable_error_code = ["attr-defined", "untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
