name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Local Spark (PySpark 4.x) needs a JVM, Java 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[spark,ml,app,sync,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated Snowflake SQL is current
        run: python scripts/generate_snowflake_sql.py --check

      # Runs before pytest: the Streamlit AppTest reads the DuckDB marts this builds.
      - name: dbt build (DuckDB, fixture data)
        working-directory: snowflake/dbt
        run: dbt build --target ci --profiles-dir .

      - name: Tests
        run: pytest

  # `databricks bundle validate` needs workspace authentication, so it is not run in CI.
