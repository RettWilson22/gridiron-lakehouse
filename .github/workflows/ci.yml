name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Python comes from .python-version; the environment is installed from uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
          activate-environment: true

      # Local Spark (PySpark 4.x) needs a JVM, Java 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated Snowflake SQL is current
        run: python scripts/generate_snowflake_sql.py --check

      # Runs before pytest: the Streamlit AppTest reads the DuckDB marts this builds.
      - name: dbt build (DuckDB, fixture data)
        working-directory: snowflake/dbt
        run: dbt build --target ci --profiles-dir .

      - name: Tests
        run: pytest

  # `databricks bundle validate` needs workspace authentication, so it is not run in CI.
