name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python comes from .python-version; the environment is installed from uv.lock.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
          activate-environment: true

      # Local Spark (PySpark 4.x) needs a JVM, Java 17 or newer.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated Snowflake SQL is current
        run: python scripts/generate_snowflake_sql.py --check

      # Runs before pytest: the Streamlit AppTest reads the DuckDB marts this builds.
      - name: dbt build (DuckDB, fixture data)
        working-directory: snowflake/dbt
        run: dbt build --target ci --profiles-dir .

      - name: Tests
        run: pytest

  # `databricks bundle validate` needs workspace authentication, so it is not run in CI.
