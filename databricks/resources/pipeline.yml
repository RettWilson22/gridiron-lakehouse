resources:
  pipelines:
    gridiron_pipeline:
      name: gridiron-pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.gridiron.name}
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../pipelines/gridiron_pipeline.py
      environment:
        dependencies:
          - ../../dist/*.whl
      configuration:
        gridiron.landing_root: /Volumes/${var.catalog}/${resources.schemas.gridiron.name}/${resources.volumes.landing.name}
        gridiron.first_season: ${var.first_season}
