resources:
  jobs:
    gridiron_refresh:
      name: gridiron-refresh
      description: >-
        Land the public fantasy football datasets, run the pipeline, backtest and train the
        projection model, project the upcoming week and publish the UniForm serving tables.
      # 12:00 UTC on Tuesday (results through Monday night), Thursday (final injury reports
      # for Thursday games) and Saturday (final reports for Sunday and Monday games).
      # Projections for games that have kicked off are never replaced by a later run.
      # Development mode pauses schedules.
      schedule:
        quartz_cron_expression: "0 0 12 ? * TUE,THU,SAT"
        timezone_id: UTC
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
              - mlflow>=3.1,<4
      # Five tasks, run one after another (Free Edition allows five concurrent tasks).
      tasks:
        - task_key: ingest
          environment_key: default
          spark_python_task:
            python_file: ../jobs/ingest.py
            parameters:
              - --landing-root
              - /Volumes/${var.catalog}/${resources.schemas.gridiron.name}/${resources.volumes.landing.name}
              - --first-season
              - ${var.first_season}

        - task_key: transform
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.gridiron_pipeline.id}

        - task_key: train
          depends_on:
            - task_key: transform
          environment_key: default
          spark_python_task:
            python_file: ../jobs/train.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.gridiron.name}
              - --experiment
              - /Users/${workspace.current_user.userName}/gridiron-fantasy
              - --test-seasons
              - ${var.test_seasons}

        - task_key: score
          depends_on:
            - task_key: train
          environment_key: default
          spark_python_task:
            python_file: ../jobs/score.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.gridiron.name}

        - task_key: publish_serving
          depends_on:
            - task_key: score
          environment_key: default
          spark_python_task:
            python_file: ../jobs/publish_serving.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.gridiron.name}
              - --serving-schema
              - ${resources.schemas.gridiron_serving.name}
