# Theme for the public copy on Streamlit Community Cloud and for local runs from the repo
# root: a newspaper sports page (newsprint, ink, field green, serif type, square corners).
# Charter (Cambria on Windows) has lining figures for the tables; Georgia sets headlines.
[theme]
base = "light"
primaryColor = "#2f5d3a"
backgroundColor = "#f7f4ec"
secondaryBackgroundColor = "#f7f4ec"
textColor = "#1b1b1b"
linkColor = "#2f5d3a"
redTextColor = "#a33a2c"
borderColor = "#8a8272"
dataframeBorderColor = "#ddd6c7"
dataframeHeaderBackgroundColor = "#f7f4ec"
showWidgetBorder = true
font = "Charter, Bitstream Charter, Cambria, Times New Roman, serif"
headingFont = "Georgia, Times New Roman, serif"
baseRadius = "0px"
buttonRadius = "0px"
chartCategoricalColors = ["#2f5d3a", "#1b1b1b", "#8a8272", "#a33a2c"]

[theme.sidebar]
backgroundColor = "#efeadf"
secondaryBackgroundColor = "#f7f4ec"

[client]
toolbarMode = "viewer"
