# Theme for the public copy. Streamlit reads this file because it sits next to the entry
# point, whatever directory the app is started from. Streamlit in Snowflake ignores
# config.toml; the app's own CSS sets the same colors there, with system fonts.

[server]
# Serves static/ next to streamlit_app.py at app/static/.
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#2f5d3a"
backgroundColor = "#f7f4ec"
secondaryBackgroundColor = "#f7f4ec"
textColor = "#1b1b1b"
linkColor = "#2f5d3a"
redTextColor = "#a33a2c"
borderColor = "#8a8272"
dataframeBorderColor = "#ddd6c7"
dataframeHeaderBackgroundColor = "#f7f4ec"
showWidgetBorder = true
baseRadius = "0px"
buttonRadius = "0px"
chartCategoricalColors = ["#2f5d3a", "#1b1b1b", "#8a8272", "#a33a2c"]
# Barlow and Barlow Semi Condensed (SIL Open Font License, static/fonts/OFL.txt), from the
# google/fonts repository: subset to Latin and converted to WOFF2, with the text faces'
# tabular figures made the default, because tables are drawn on a canvas where
# font-variant-numeric does not apply.
font = "Barlow, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif"
headingFont = "Barlow Semi Condensed, Avenir Next Condensed, Arial Narrow, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow Semi Condensed"
url = "app/static/fonts/BarlowSemiCondensed-Bold.woff2"
weight = 700

[theme.sidebar]
backgroundColor = "#efeadf"
secondaryBackgroundColor = "#f7f4ec"

[client]
toolbarMode = "viewer"
